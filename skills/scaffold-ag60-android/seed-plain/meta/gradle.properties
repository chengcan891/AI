android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g  -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
unityStreamingAssets=.unity3d
#MATRIX_VERSION=2.0.0

org.gradle.caching=true
